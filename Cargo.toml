[package]
name = "tree-sitter-macaulay2"
description = "macaulay2 grammar for the tree-sitter parsing library"
version = "1.3.0"
keywords = ["incremental", "parsing", "macaulay2"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/tree-sitter/tree-sitter-macaulay2"
edition = "2018"
license = "MIT"

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", tag = "v0.25.1" }

[build-dependencies]
cc = "1.0"
