name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  parser:
    name: Parser and bindings
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run parse:examples

      - name: Test Node binding
        run: npm run test:node

      - name: Test Rust binding
        run: cargo test
