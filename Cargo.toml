[package]
name = "tree-sitter-macaulay2"
description = "Macaulay2 grammar for the tree-sitter parsing library"
authors = ["Alexander Golys <alexandergolys@gmail.com>"]
version = "6.3.3"
keywords = ["incremental", "parsing", "macaulay2"]
categories = ["parsing", "text-editors"]
homepage = "https://spectralflux.dev/projects/tree-sitter-macaulay2"
documentation = "https://docs.rs/tree-sitter-macaulay2"
repository = "https://github.com/AlexanderGolys/tree-sitter-macaulay2"
readme = "README.md"
edition = "2018"
license = "MIT OR Apache-2.0"

build = "bindings/rust/build.rs"
include = [
  "LICENSE-*",
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = "0.26.9"

[build-dependencies]
cc = "1.0"
